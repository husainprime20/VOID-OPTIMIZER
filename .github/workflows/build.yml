name: build

# Builds VOID for Windows x64.
#   • every push        → compiles both binaries + downloads an artifact
#   • commit with       → compiles AND publishes the GitHub release
#     "[release]" in      (tag: v<version from Cargo.toml>, targeted at main)
#     the message
#   • a v* tag push     → compiles AND publishes the release
#   • manual run        → set `release: true` to publish
#
# GitHub Actions is the only compiler that can see crates.io for this project,
# so this workflow doubles as the build + smoke-test gate for the native UI.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release from this run"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Statically link the MSVC runtime so the exe runs on a clean Windows install
  # without the VC++ redistributable.
  RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_NET_RETRY: "10"

jobs:
  windows-x64:
    name: windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustc -Vv
          cargo -V

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo check` first: it is the fastest way to fail, and on failure the
      # errors are re-emitted as check-run annotations so they are readable from
      # anywhere (the raw step log lives on a CDN that some networks block).
      - name: Check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --bins 2>&1 | Tee-Object -FilePath check.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content check.log
            $blocks = @()
            $cur = $null
            foreach ($l in $lines) {
              if ($l -match '^(error|warning: unused)') {
                if ($cur) { $blocks += $cur }
                $cur = $l
              } elseif ($cur -and $l.Trim() -ne '' -and $blocks.Count -lt 12) {
                $cur = $cur + ' ~~ ' + $l.Trim()
                if ($cur.Length -gt 1200) { $blocks += $cur; $cur = $null }
              }
            }
            if ($cur) { $blocks += $cur }
            $i = 0
            foreach ($b in ($blocks | Select-Object -First 10)) {
              $i++
              Write-Host ("::error title=Rust error $i::" + ($b -replace '\|', '/'))
            }
            throw "cargo check failed ($code)"
          }
          Write-Host "check ok"

      # Both binaries: the native window (VOID.exe) and the console companion.
      # Same annotation trick as the check step: a link error must be readable
      # without access to the CDN-hosted step log.
      - name: Build (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --release --bins 2>&1 | Tee-Object -FilePath build.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content build.log
            $blocks = @()
            $cur = $null
            foreach ($l in $lines) {
              if ($l -match '^(error|warning: unused)') {
                if ($cur) { $blocks += $cur }
                $cur = $l
              } elseif ($cur -and $l.Trim() -ne '' -and $blocks.Count -lt 12) {
                $cur = $cur + ' ~~ ' + $l.Trim()
                if ($cur.Length -gt 1200) { $blocks += $cur; $cur = $null }
              }
            }
            if ($cur) { $blocks += $cur }
            $i = 0
            foreach ($b in ($blocks | Select-Object -First 10)) {
              $i++
              Write-Host ("::error title=Build error $i::" + ($b -replace '\|', '/'))
            }
            throw "release build failed ($code)"
          }
          Write-Host "build ok"

      - name: Smoke test
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "VOID_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          $out = & .\target\release\void-cli.exe --version
          Write-Host "cli --version: $out"
          if ($out -notmatch [regex]::Escape($version)) { throw "unexpected --version output: $out" }

          & .\target\release\void-cli.exe catalog > catalog.json
          $size = (Get-Item catalog.json).Length
          Write-Host "catalog.json: $size bytes"
          if ($size -lt 5000) { throw "catalog output looks truncated ($size bytes)" }

          & .\target\release\void-cli.exe status --json | Out-File -Encoding utf8 status.json
          Get-Content status.json -Raw

          # The GUI binary has no console, so it proves itself head-lessly and
          # writes a report. Start-Process -Wait is required: PowerShell does not
          # wait for a windows-subsystem executable on its own.
          $p = Start-Process -FilePath .\target\release\void.exe -ArgumentList '--selftest' -Wait -PassThru
          Write-Host "VOID.exe --selftest exit: $($p.ExitCode)"
          if (Test-Path void-selftest.txt) { Get-Content void-selftest.txt -Raw }
          if ($p.ExitCode -ne 0) { throw "VOID.exe --selftest failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path void-selftest.txt -Pattern '^ok=true' -Quiet)) { throw "selftest did not report ok=true" }

      # Telemetry channel: the raw step log lives on a CDN some networks block,
      # so the numbers that matter (boot time, selftest, compiler tail) are
      # committed to the disposable `void-ci` branch instead.
      - name: Telemetry
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "void-ci"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $report = "no selftest report"
          if (Test-Path void-selftest.txt) { $report = Get-Content void-selftest.txt -Raw }
          $tail = "no check log"
          if (Test-Path build.log) { $tail = ((Get-Content build.log -Tail 60) -join "`n") }
          elseif (Test-Path check.log) { $tail = ((Get-Content check.log -Tail 60) -join "`n") }
          $body = @"
          sha: $env:GITHUB_SHA
          run: $env:GITHUB_RUN_ID
          ref: $env:GITHUB_REF

          ## selftest
          $report

          ## compiler tail
          $tail
          "@
          Set-Content -Path (Join-Path $dir "last-run.md") -Value $body -Encoding utf8
          Push-Location $dir
          git init -q
          git checkout -q -B void-ci
          git config user.name "void-ci"
          git config user.email "ci@void.invalid"
          git add last-run.md
          git commit -q -m "ci telemetry [skip ci]"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" void-ci
          Pop-Location

      - name: Package
        shell: pwsh
        run: |
          $ver = $env:VOID_VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\void.exe dist\VOID.exe
          Copy-Item target\release\void-cli.exe dist\void-cli.exe
          Copy-Item README.md dist\README.md

          @"
          VOID $ver — competitive gaming optimizer
          ========================================

          A native Windows desktop app. No browser, no webview, no installer.

          HOW TO RUN
          1. Double-click VOID.exe.
             Windows asks for Administrator once (the tweaks need it) — say yes.
          2. The window opens. Press IGNITE, or open Profiles and engage one.

          WHAT YOU GET
          - 42 documented, reversible tweaks across power, kernel, CPU, GPU,
            network, input, storage and a dedicated Free Fire lane.
          - Live telemetry, sleep-jitter benchmark, process boost, eDPI lab.
          - Built-in ambient bed (three presets, volume control) — calm, low, slow.
          - Dry run, automatic restore point, one-click revert of everything.

          SAFETY
          - Nothing runs until you press a button; every command is shown first.
          - Settings -> Dry run prints commands without changing anything.
          - "Revert all" restores every value VOID touched.
          - VOID never touches game files, game memory or anti-cheat.
          - Journal: %APPDATA%\VOID\void.log

          Windows SmartScreen may warn because this build is not code-signed.
          More info -> "Run anyway".

          CONSOLE COMPANION (optional)
            void-cli.exe status --json
            void-cli.exe apply freefire
            void-cli.exe revert
            void-cli.exe bench

          Build from source: https://github.com/${{ github.repository }}
          "@ | Set-Content -Encoding utf8 dist\READ-ME-FIRST.txt

          @"
          @echo off
          rem Same as double-clicking VOID.exe: it elevates itself. Kept for people
          rem who prefer an explicit "run as admin" shortcut.
          powershell -NoProfile -Command "Start-Process -FilePath '%~dp0VOID.exe' -WorkingDirectory '%~dp0' -Verb RunAs"
          "@ | Set-Content -Encoding ascii dist\RUN-AS-ADMIN.bat

          Compress-Archive -Path dist\* -DestinationPath "VOID-$ver-windows-x64.zip" -Force
          Get-FileHash "VOID-$ver-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  VOID-$ver-windows-x64.zip" } | Set-Content SHA256SUMS.txt
          Get-FileHash dist\VOID.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  VOID.exe" } | Add-Content SHA256SUMS.txt

          # self-verify the portable zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "VOID-$ver-windows-x64.zip")).Entries.FullName
          Write-Host ("zip entries: " + ($entries -join ", "))
          foreach ($need in @("VOID.exe", "void-cli.exe", "RUN-AS-ADMIN.bat", "READ-ME-FIRST.txt", "README.md")) {
            if ($entries -notcontains $need) { throw "zip is missing $need" }
          }

          $kb = [math]::Round((Get-Item dist\VOID.exe).Length / 1KB, 0)
          Write-Host "VOID.exe: $kb KB"
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VOID-windows-x64
          path: |
            dist/VOID.exe
            dist/void-cli.exe
            VOID-*-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.release ||
          contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = $env:VOID_VERSION
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $tag = "v$ver"
          }
          $assets = @("dist/VOID.exe", "dist/void-cli.exe", "VOID-$ver-windows-x64.zip", "SHA256SUMS.txt")

          $sha = $env:GITHUB_SHA
          $repo = $env:GITHUB_REPOSITORY
          $url = "https://github.com/$repo"
          $notes = @"
          ## VOID $ver — Windows x64

          A real desktop app: one native window, drawn on the GPU. No Chromium, no
          webview, no localhost server, no console window behind it.

          **Run:** double-click VOID.exe. It asks for Administrator once, then opens.

          ### What changed in 0.2.0
          - **Native UI.** The browser-based surface is gone. The window is rendered
            with egui (OpenGL), so it opens instantly, works offline, and has no
            "engine offline" state to fall into — the engine runs in the same process.
          - **No terminal window.** The binary is built for the Windows GUI subsystem
            and every helper process (reg, sc, powercfg, PowerShell) is spawned with
            CREATE_NO_WINDOW.
          - **Real ambient audio.** A synthesised drone — 55 Hz floor, detuned fifths,
            slow filtered air, one soft bell every ~11 s. Three presets, volume control.
          - **Persistent applied stack.** Applied tweaks survive restarts and dry-run no
            longer claims a change that was never written.
          - **New:** live process list with one-click priority boost, emulator
            detection + boost, sleep-jitter benchmark panel, eDPI/360° converter with
            per-game sensitivity equivalents, restore point from anywhere.

          ### What's inside
          - **42** documented, reversible tweaks · **7** profiles
          - **Kernel tier** — timer resolution, TSC sync policy, HAGS, Win32PrioritySeparation, VBS off
          - **Free Fire / FF Max** — emulator priority and core pinning, low-latency net stack
          - **Latency** — Nagle off on every interface, MMCSS Games task, network throttling off
          - **Frame pacing** — Game DVR off, true exclusive fullscreen, PCIe always-on
          - Every command is visible before it runs, and everything can be reverted

          ### Notes
          - Not code-signed: SmartScreen will ask once → *More info* → *Run anyway*.
          - Requires Windows 10/11 x64. Static CRT: no Visual C++ redistributable.
          - void-cli.exe is the optional console companion (status/apply/revert/bench).

          Built from $sha by GitHub Actions on windows-latest. Source: $url
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists — uploading assets"
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "creating release $tag (target: main)"
            gh release create $tag --target main --title "VOID $ver" --notes $notes @assets
          }
          gh release view $tag
