[package]
name = "void-optimizer"
version = "0.9.4"
edition = "2021"
description = "VOID // a luxury-grade competitive gaming optimizer"
license = "MIT"
readme = "README.md"

# Native desktop app (no browser, no webview, no HTTP server in the UI path).
[[bin]]
name = "void"
path = "src/gui.rs"

# Head-less console companion: status / apply / revert / bench / serve.
[[bin]]
name = "void-cli"
path = "src/cli.rs"

[target.'cfg(windows)'.build-dependencies]
# Writes the icon + version block into VOID.exe. Best-effort (see build.rs).
winres = "0.1"

[dependencies]
# UI: immediate-mode, GPU-drawn (OpenGL 3.3 — runs on a GT 730). Default features
# keep winit's raw-window-handle support, which the Windows backend needs.
eframe = "0.29"
# Audio: WASAPI playback; decoders are disabled because VOID synthesises its own sound.
rodio = { version = "0.19", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
